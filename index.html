        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .animate-marquee:hover { animation-play-state: paused; }
        @keyframes marquee-slow { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .animate-marquee-slow { display: flex; width: max-content; animation: marquee-slow 80s linear infinite; }
        @keyframes marquee-reverse { 0% { transform: translateX(-50%); } 100% { transform: translateX(0); } }

        /* Reusable Premium Box & Card Designs */
        .glass-card {
            background: rgba(11, 17, 32, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 193, 7, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 193, 7, 0.05);
        }
        
        .glass-card-featured {
            background: linear-gradient(135deg, rgba(11, 17, 32, 0.75) 0%, rgba(5, 5, 5, 0.9) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 193, 7, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 193, 7, 0.08);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);

        .glass-card-featured:hover {

            border-color: rgba(255, 193, 7, 0.7);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 193, 7, 0.2);
        }

        .dossier-card {
            background: rgba(5, 5, 5, 0.8);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dossier-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: #FFC107;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        .dossier-card:hover {
            border-style: solid;
            border-color: rgba(255, 193, 7, 0.4);
            transform: translate(2px, -2px);
            box-shadow: -5px 5px 20px rgba(0, 0, 0, 0.6);
        }
        .dossier-card:hover::before {
            opacity: 1;
        }

        .featured-badge {
