<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CorePlatform — Demo</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Outfit:wght@300..900&display=swap" rel="stylesheet">
  
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#FFC107',
            'primary-dark': '#E5AD06',
            'background-dark': '#050505',
            'navy-deep': '#0B1120',
            'slate-grey': '#334155',
            'card-dark': '#0A0A0A',
            'border-dark': '#1A1A1A'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Global Styles -->
  <style>
    html { scroll-behavior: smooth; }
    h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; letter-spacing: -0.02em; }
    *:focus-visible { outline: 2px solid #FFC107; outline-offset: 2px; }
    .glass-card { 
      background: rgba(11,17,32,0.45); 
      backdrop-filter: blur(12px); 
      border: 1px solid rgba(255,255,255,0.06); 
      transition: all 0.3s ease; 
    }
    .glass-card:hover { 
      transform: translateY(-2px); 
      border-color: rgba(255,193,7,0.3); 
      box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
    }
  </style>
</head>
<body class="bg-background-dark text-white antialiased font-sans">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
